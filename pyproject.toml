[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dossier"
version = "1.0.0"
authors = [
    {name = "Corey Bonnell", email = "corey.bonnell@digicert.com"},
    {name = "Michael Lettona", email = "michael.lettona@digicert.com"},
    {name = "Alex Campbell", email = "alex.campbell@digicert.com"},
]
description = "Certificate processing and OCSP validation tool"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.9",
    "Topic :: Security :: Cryptography",
    "Topic :: System :: Systems Administration",
]
keywords = ["certificates", "x509", "ocsp", "ssl", "tls", "cryptography"]
dependencies = [
    "asn1crypto",
    "cryptography",
    "requests",
    "tqdm",
    "httpx",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "black",
    "flake8",
    "mypy",
]

[project.urls]
Homepage = "https://github.com/digicert/dossier"
Repository = "https://github.com/digicert/dossier"
Issues = "https://github.com/digicert/dossier/issues"

[project.scripts]
dossier = "dossier.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dossier*"]

[tool.setuptools.package-data]
dossier = ["py.typed"]

[tool.black]
line-length = 88
target-version = ['py38']

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
